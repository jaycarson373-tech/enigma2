[package]
name = "enigma2"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
pinocchio = { version = "=0.11.2", features = ["cpi"] }
pinocchio-system = "=0.6.1"
borsh = { version = "=1.5.1", features = ["derive"] }
uint = { version = "=0.9.5", default-features = false }
solana-sha256-hasher = { version = "=3.0.0", features = ["sha2"] }
[features]
no-entrypoint = []
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
[dev-dependencies]
solana-address = { version = "=2.9.0", features = ["curve25519"] }
